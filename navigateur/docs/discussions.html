<title>Page réponse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Page réponse : un tableau de propositions, une colonne pour répondre. Mêmes couleurs que l'arbre des découvertes. */
:root{--bg:#f3f1ec;--panel:#fbfaf7;--fg:#22211e;--mut:#6c6860;--rule:#d9d5cc;--ok:#2f8f5b;--no:#c0392b;--mod:#c2780a;--acc:#3b6fb6;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0;font-weight:600} p{margin:0;color:var(--mut);line-height:1.5;max-width:80ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{font:600 13px var(--sans);padding:8px 14px;border:1px solid var(--rule);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);border-color:var(--fg)}
.tab .n{font:500 11px var(--mono);margin-left:6px;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:400 12px var(--mono);color:var(--mut)}
button{font:600 12px var(--sans);border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer;padding:7px 11px} button:hover{border-color:var(--mut)} button:disabled{opacity:.45;cursor:default}
button.danger.arm{border-color:var(--no);color:var(--no)}
select,textarea{font:400 13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:5px;padding:5px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--rule)}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:.9rem;line-height:1.45}
td.name{width:22%;font-weight:600} td.rec{width:27%} td.role{width:23%;color:var(--mut)} td.ans{width:28%}
.chip{display:inline-block;font:600 10px var(--mono);padding:1px 6px;border-radius:9px;border:1.5px solid var(--rule);margin-top:4px;color:var(--mut)} .chip.meca{border-color:var(--mod);color:var(--mod)}
.btns{display:flex;gap:5px;flex-wrap:wrap} .btns button{padding:5px 9px}
.btns button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff} .btns button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff} .btns button[aria-pressed="true"].mod{background:var(--mod);border-color:var(--mod);color:#fff}
.note{width:100%;min-height:34px;margin-top:6px;resize:vertical}
tr.done td.name::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#out{width:100%;min-height:140px;font:400 12px var(--mono)}
@media (max-width:760px){table,tbody,tr,td{display:block;width:auto!important} thead{display:none} tr{border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;padding:6px} td{border:none;padding:4px 8px} td.rec::before{content:attr(data-l) " : ";color:var(--mut);font-weight:600} td.role::before{content:attr(data-l) " : ";font-weight:600}}
</style>
<main>
<h1 id="ttl"></h1>
<p id="intro"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar"><span id="cnt"></span>
<select id="flt" aria-label="Filtrer"><option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">Oui</option><option value="no">Non</option><option value="mod">À modifier</option></select>
<button id="undo">Annuler le dernier changement</button><button id="reset" class="danger">Tout réinitialiser</button><button id="copy">Copier mes réponses</button></div>
<textarea id="out" hidden readonly aria-label="Texte à copier"></textarea>
<table><thead><tr id="thr"></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const DATA={"key": "discussions4", "title": "Discussions : suite (2)", "intro": "Tes réponses sont appliquées ou notées. Voici ce qui reste, surtout des choix de conception avant de coder la batterie portable, l'assembleur avancé, les portails et le terrain en voxels.", "cols": ["Sujet", "Mes remarques", "Ma proposition ou ma question", "Ta réponse"], "btns": ["D'accord", "Pas d'accord", "À discuter"], "tabs": [{"id": "a", "label": "Batterie portable"}, {"id": "b", "label": "Assembleurs"}, {"id": "c", "label": "Portails"}, {"id": "d", "label": "Monde creusable"}, {"id": "e", "label": "Rails et Unreal"}, {"id": "f", "label": "Rails : ce que montre la vidéo"}], "rows": [{"id": "a1", "tab": "a", "name": "Principe", "tag": "a1", "recipe": "Noté : une batterie portable (nouvelle recette) se met dans le propulseur par glisser-déposer depuis le sac et se retire de la même façon. Elle se recharge dans un accumulateur. Une jauge est dessinée sur son icône et aussi sur l'icône du propulseur quand il est équipé. La batterie lithium actuelle devient un ingrédient de la batterie portable et n'est plus consommée par le propulseur.", "role": "Recette proposée : 2 batteries lithium + 1 châssis simple + 1 kit circuit (3 types). Autonomie : 60 s de poussée pour une batterie pleine. Ok ?"}, {"id": "a2", "tab": "a", "name": "Charge d'une batterie : limite technique", "tag": "a2", "recipe": "Aujourd'hui le sac ne retient que « combien de tel objet » : il ne sait pas qu'une batterie est à 40 % et une autre à 90 %. Pour une jauge par batterie il faut soit une vraie donnée par objet (gros chantier : sac, coffres, sauvegarde, réseau), soit des niveaux séparés.", "role": "Recommandation : 5 niveaux (vide, 25, 50, 75, plein), chacun étant un objet distinct qui s'empile. Le propulseur garde la charge exacte de la batterie insérée. Ok, ou tu veux la charge exacte par batterie ?"}, {"id": "a3", "tab": "a", "name": "Où se recharge-t-elle ?", "tag": "a3", "recipe": "Tu dis « dans un accu ». Aujourd'hui l'accumulateur (T4) stocke l'énergie du réseau mais n'a pas de case pour un objet. La borne de recharge (T4, prévue pour la locomotive) est faite pour ça.", "role": "Recommandation : la borne de recharge recharge les batteries portables ET la locomotive ; l'accumulateur reste un stockage du réseau. Ou tu préfères que l'accumulateur ait une case de recharge ?"}, {"id": "a4", "tab": "a", "name": "Dépendance à l'énergie", "tag": "a4", "recipe": "La recharge demande un réseau électrique et la borne (T4) ; l'énergie lot 1 n'est pas codée. Le propulseur ne se recharge donc pas encore.", "role": "Je code la batterie portable, le glisser-déposer et la jauge maintenant, et la borne de recharge avec le lot énergie. D'accord ?"}, {"id": "b1", "tab": "b", "name": "Assembleur avancé", "tag": "b1", "recipe": "Idée retenue : l'assembleur simple fait les recettes à 3 types d'ingrédients au plus, l'avancé (palier 3) en fait 4 au plus et travaille plus vite (1,5 s au lieu de 3 s). Problème : aujourd'hui l'assembleur fabrique déjà des objets à 4, 5 ou 6 types, par exemple la foreuse électrique (5), la raffinerie (6), le buggy (6), la locomotive (5) : 25 objets dépassent 3 types, 12 dépassent 4.", "role": "Recommandation : d'abord réécrire ces recettes avec les intermédiaires (kit circuit, châssis, microcontrôleur…) pour respecter 3 et 4 types, ENSUITE ajouter l'assembleur avancé et appliquer la limite. Ok ? Je te prépare la page de réponse des recettes à réécrire."}, {"id": "b2", "tab": "b", "name": "Paquets de science à l'assembleur", "tag": "b2", "recipe": "Les paquets ont 2 à 3 types d'ingrédients : l'assembleur simple suffit. À la main : plus lent (ma proposition 5 s × palier), à l'assembleur : plus rapide.", "role": "Les durées te conviennent-elles : main 5 s × palier, assembleur 2 s × palier ?"}, {"id": "c1", "tab": "c", "name": "Portail de 3 m", "tag": "c1", "recipe": "Décidé : portail de 3 m (un véhicule passe), s'ouvre à la touche d'action, les ennemis ne l'ouvrent pas. Un par palier de barrière (bois, béton, béton armé). Donc 6 objets : 3 barrières et 3 portails.", "role": "Les ennemis le détruisent-ils quand même (comme les murs) ? Un portail se pose-t-il entre deux poteaux comme une porte, ou comme une pièce seule ?"}, {"id": "d1", "tab": "d", "name": "Terrain en voxels : ce que j'ai compris", "tag": "d1", "recipe": "Voxels, profondeur réglable dans l'éditeur de partie (50 blocs par défaut), couches de terrain différentes comme Minecraft, relief aussi en surface, pas de tunnels pour tapis et tuyaux (ils passent en bas, à un niveau plus bas).", "role": "C'est bien ça ? « Passer en bas » = poser le tapis ou le tuyau plus bas dans le terrain creusé ?"}, {"id": "d2", "tab": "d", "name": "Taille d'un bloc", "tag": "d2", "recipe": "Aujourd'hui tout est sur une grille de 50 cm (machines de 4 × 4 cases, murs en blocs de 50 cm). Un bloc de terrain de 1 m est plus léger à calculer (8 fois moins de blocs qu'à 50 cm) ; 50 cm colle à la grille actuelle.", "role": "Recommandation : blocs de 1 m, 50 de profondeur = 50 m, et la grille de construction reste à 50 cm. Ok ?"}, {"id": "d3", "tab": "d", "name": "Minerais et ressources", "tag": "d3", "recipe": "Aujourd'hui un minerai est une case en surface avec une quantité. En voxels les gisements deviennent des blocs ou des veines sous terre, extraits en creusant ou par les foreuses.", "role": "Les foreuses creusent-elles les blocs ? Les gisements de surface actuels deviennent-ils des veines qui descendent ? Pétrole, uranium, eau souterraine ?"}, {"id": "d4", "tab": "d", "name": "Machines, rails et sol", "tag": "d4", "recipe": "Une machine de 4 × 4 cases sur un terrain irrégulier : on doit niveler (creuser ou remblayer), ou la machine pose sa propre dalle. Les rails demandent un sol régulier (voir aussi la refonte).", "role": "Recommandation : poser une machine aplatit automatiquement son emprise si l'écart est de 1 m au plus ; au-delà il faut niveler à la main. Ok ?"}, {"id": "d5", "tab": "d", "name": "Faisabilité et ordre", "tag": "d5", "recipe": "C'est le plus gros chantier du projet : terrain découpé en tranches de blocs, sauvegarde seulement des modifications, mise à jour de la mise en maillage sans saccade. Je propose un essai de 2 semaines de travail dans le navigateur (terrain voxel simple, creuser, poser une machine), avant de l'intégrer à l'usine et de choisir Unreal.", "role": "D'accord pour commencer par ce prototype ? Il passe avant ou après l'énergie lot 1 ?"}, {"id": "e1", "tab": "e", "name": "Rails à refaire", "tag": "e1", "recipe": "Vidéo reçue et regardée (80 s, c'est Factorio : le HUD parle de « tronçon » et de « santé »). Je ne touche plus aux rails tant que tu n'as pas validé la page « Rails : ce que montre la vidéo ». Images de référence : `navigateur/docs/rails-reference/`.", "role": "Voir l'onglet « Rails : ce que montre la vidéo »."}, {"id": "e2", "tab": "e", "name": "Unreal : on ne se lance pas", "tag": "e2", "recipe": "Fait : j'ai écrit le brouillon des prérequis dans `unreal/prerequis.md` (matériel, décisions de projet, plugins à étudier, configuration de l'éditeur, premier essai). Aucun projet n'est créé.", "role": "Relis-le : qu'est-ce qui manque dans la liste ?"}, {"id": "f1", "tab": "f", "name": "Fantôme vert qui suit le curseur", "tag": "f1", "recipe": "Ce que je vois : la pièce choisie apparaît en vert transparent sous le curseur, avec le nombre de rails restants. Un clic la pose. Quand la pose est impossible le fantôme est remplacé par une croix rouge (par exemple une pièce posée par-dessus une autre, ou trop loin).", "role": "Je garde ça : fantôme vert pour valide, croix rouge pour impossible, avec une phrase qui dit pourquoi (en survol)."}, {"id": "f2", "tab": "f", "name": "Peu de pièces, toutes de même taille", "tag": "f2", "recipe": "Ce que je vois : un rail droit de 2 cases de long, un virage de 45° de rayon fixe (8 virages font un cercle complet, on le voit sur la vidéo), et des droits en diagonale pour continuer après un virage. Pas de longueur libre, pas de virage serré, moyen ou grand.", "role": "Je remplace nos trois tailles de virages (bleu, violet, marron) par UN virage de 45°. Le droit existe en 8 orientations. Ok ?"}, {"id": "f3", "tab": "f", "name": "Accrochage automatique au bout d'un rail", "tag": "f3", "recipe": "Ce que je vois : le fantôme se colle tout seul sur le bout libre d'un rail et prend l'orientation qui prolonge la voie (virage dans le prolongement du droit, puis le cercle se referme pièce après pièce). Loin d'un rail, il suit la grille libre (cases de 2).", "role": "Même principe chez nous : bout libre le plus proche du curseur dans un rayon de 3 cases, sinon grille libre. Une touche (R) fait tourner le fantôme (ou choisit droite / gauche)."}, {"id": "f4", "tab": "f", "name": "Embranchement SANS pièce d'aiguillage", "tag": "f4", "recipe": "Ce que je vois : à la fin d'un rail droit, on pose un virage qui part de ce même bout : le droit continue et le virage s'écarte, ce qui forme un Y. Aucune pièce spéciale : un bout de rail peut avoir plusieurs suites. Le train choisira la branche selon sa destination.", "role": "C'est ce que tu veux. Nous avons aujourd'hui des aiguillages en pièce : je les retire. Règle du train à un embranchement : il va vers sa prochaine station ; sinon tout droit."}, {"id": "f5", "tab": "f", "name": "Croix rouge : causes", "tag": "f5", "recipe": "Ce que je vois : croix rouge quand la pièce chevauche une autre voie (essai de prolonger tout droit sur une voie déjà posée), ou quand elle ne se raccorde à rien de valide.", "role": "Causes que je gérerais : chevauche une voie, trop loin du joueur, obstacle (machine, mur, arbre), pente trop forte (avec le terrain en voxels), raccord non aligné."}, {"id": "f6", "tab": "f", "name": "Sélection et retrait", "tag": "f6", "recipe": "Ce que je vois : en survolant un rail, des crochets jaunes l'entourent et un panneau donne « Trains dans le tronçon » et « Santé 200/200 ». Un clic de la pioche retire la pièce.", "role": "Même chose : survol = crochets + infos (nombre de trains, santé), retrait avec la pioche ; le rail retiré rend l'objet."}, {"id": "f7", "tab": "f", "name": "Sauvegardes existantes", "tag": "f7", "recipe": "Les anciens rails ne sont pas dans la logique des pièces fixes (virages de 3 tailles, aiguillages).", "role": "Option A : on supprime les rails des anciennes parties et on les rend dans le sac. Option B : conversion automatique en pièces fixes (risque d'erreurs de raccord). Je recommande A."}, {"id": "f8", "tab": "f", "name": "Ce que je ne vois pas dans la vidéo", "tag": "f8", "recipe": "Pas de signaux, pas de gares, pas de train en marche, pas de passage à niveau, pas de pont.", "role": "Veux-tu aussi le comportement de Factorio pour les signaux et les trains, ou on garde nos règles (stations et programmes) ?"}]};
const KEY='terra-reponse-'+DATA.key;
let ans={},hist=[],tab=DATA.tabs[0].id,filter='all';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')ans=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=DATA.cols||['Proposition','Recette ou principe','Pourquoi','Votre réponse'];
const LAB=DATA.btns?{yes:DATA.btns[0],no:DATA.btns[1],mod:DATA.btns[2]}:{yes:'Oui',no:'Non',mod:'À modifier'};
const $=id=>document.getElementById(id);
$('thr').innerHTML=COLS.map(c=>`<th>${esc(c)}</th>`).join('');
$('flt').innerHTML=`<option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">${LAB.yes}</option><option value="no">${LAB.no}</option><option value="mod">${LAB.mod}</option>`;
$('ttl').textContent=DATA.title;$('intro').textContent=DATA.intro;
function snapshot(){hist.push(JSON.stringify(ans));if(hist.length>60)hist.shift()}
function counts(){const all=DATA.rows.length,done=DATA.rows.filter(r=>ans[r.id]&&ans[r.id].v).length;return{all,done}}
function render(){
 $('tabs').innerHTML=DATA.tabs.map(t=>{const rs=DATA.rows.filter(r=>r.tab===t.id),d=rs.filter(r=>ans[r.id]&&ans[r.id].v).length;return`<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===tab}">${esc(t.label)}<span class="n">${d}/${rs.length}</span></button>`}).join('');
 const rows=DATA.rows.filter(r=>r.tab===tab).filter(r=>{const a=ans[r.id]||{};return filter==='all'||(filter==='todo'?!a.v:a.v===filter)});
 $('rows').innerHTML=rows.map(r=>{const a=ans[r.id]||{};
  return`<tr data-id="${r.id}" class="${a.v?'done':''}"><td class="name">${esc(r.name)}${(r.tag||r.effort)?`<br><span class="chip ${r.effort==='mécanique'?'meca':''}">${esc(r.tag||(r.effort==='mécanique'?'Mécanique':'Objet'))}</span>`:''}</td><td class="rec" data-l="${esc(COLS[1])}">${esc(r.recipe)}</td><td class="role" data-l="${esc(COLS[2])}">${esc(r.role)}</td>
  <td class="ans"><div class="btns">${['yes','no','mod'].map(v=>`<button class="${v}" data-v="${v}" aria-pressed="${a.v===v}">${LAB[v]}</button>`).join('')}</div><textarea class="note" placeholder="Commentaire (facultatif)" aria-label="Commentaire">${esc(a.c||'')}</textarea></td></tr>`}).join('')||'<tr><td colspan="4">Aucune ligne pour ce filtre.</td></tr>';
 const c=counts();$('cnt').textContent=`${c.done} réponse${c.done>1?'s':''} sur ${c.all}`;$('undo').disabled=!hist.length}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.tab;render()}});
$('flt').onchange=e=>{filter=e.target.value;render()};
$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;const id=b.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.v=a.v===b.dataset.v?'':b.dataset.v;if(!a.v&&!a.c)delete ans[id];save();render()});
$('rows').addEventListener('change',e=>{if(!e.target.classList.contains('note'))return;const id=e.target.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.c=e.target.value.trim();if(!a.v&&!a.c)delete ans[id];save();render()});
$('undo').onclick=()=>{if(!hist.length)return;ans=JSON.parse(hist.pop());save();render()};
let armed=0;$('reset').onclick=()=>{const b=$('reset');if(!armed){armed=1;b.classList.add('arm');b.textContent='Confirmer : tout effacer ?';setTimeout(()=>{armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser'},3500);return}
 snapshot();ans={};save();armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser';render()};
$('copy').onclick=async()=>{
 const lines=[DATA.title];
 DATA.tabs.forEach(t=>{const rs=DATA.rows.filter(r=>r.tab===t.id&&ans[r.id]&&(ans[r.id].v||ans[r.id].c));if(!rs.length)return;lines.push('',t.label);
  rs.forEach(r=>{const a=ans[r.id];lines.push(`- ${r.name} : ${a.v?LAB[a.v].toUpperCase():'(sans choix)'}${a.c?' — '+a.c:''}`)})});
 const todo=DATA.rows.filter(r=>!(ans[r.id]&&ans[r.id].v)).map(r=>r.name);
 if(todo.length)lines.push('',`Sans réponse (${todo.length}) : ${todo.join(', ')}`);
 const txt=lines.join('\n');
 try{await navigator.clipboard.writeText(txt);$('cnt').textContent='Copié : collez-le dans la discussion.'}catch(e){$('out').hidden=false;$('out').value=txt;$('out').select()}};
render();
</script>

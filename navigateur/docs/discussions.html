<title>Page réponse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Page réponse : un tableau de propositions, une colonne pour répondre. Mêmes couleurs que l'arbre des découvertes. */
:root{--bg:#f3f1ec;--panel:#fbfaf7;--fg:#22211e;--mut:#6c6860;--rule:#d9d5cc;--ok:#2f8f5b;--no:#c0392b;--mod:#c2780a;--acc:#3b6fb6;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0;font-weight:600} p{margin:0;color:var(--mut);line-height:1.5;max-width:80ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{font:600 13px var(--sans);padding:8px 14px;border:1px solid var(--rule);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);border-color:var(--fg)}
.tab .n{font:500 11px var(--mono);margin-left:6px;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:400 12px var(--mono);color:var(--mut)}
button{font:600 12px var(--sans);border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer;padding:7px 11px} button:hover{border-color:var(--mut)} button:disabled{opacity:.45;cursor:default}
button.danger.arm{border-color:var(--no);color:var(--no)}
select,textarea{font:400 13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:5px;padding:5px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--rule)}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:.9rem;line-height:1.45}
td.name{width:22%;font-weight:600} td.rec{width:27%} td.role{width:23%;color:var(--mut)} td.ans{width:28%}
.chip{display:inline-block;font:600 10px var(--mono);padding:1px 6px;border-radius:9px;border:1.5px solid var(--rule);margin-top:4px;color:var(--mut)} .chip.meca{border-color:var(--mod);color:var(--mod)}
.btns{display:flex;gap:5px;flex-wrap:wrap} .btns button{padding:5px 9px}
.btns button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff} .btns button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff} .btns button[aria-pressed="true"].mod{background:var(--mod);border-color:var(--mod);color:#fff}
.note{width:100%;min-height:34px;margin-top:6px;resize:vertical}
tr.sec td{background:var(--bg);font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg);padding:14px 10px 6px;border-bottom:2px solid var(--fg)}
td{padding:8px 10px}
tr.done td.name::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#out{width:100%;min-height:140px;font:400 12px var(--mono)}
@media (max-width:760px){table,tbody,tr,td{display:block;width:auto!important} thead{display:none} tr{border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;padding:6px} td{border:none;padding:4px 8px} td.rec::before{content:attr(data-l) " : ";color:var(--mut);font-weight:600} td.role::before{content:attr(data-l) " : ";font-weight:600}}
</style>
<main>
<h1 id="ttl"></h1>
<p id="intro"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar"><span id="cnt"></span>
<select id="flt" aria-label="Filtrer"><option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">Oui</option><option value="no">Non</option><option value="mod">À modifier</option></select>
<button id="undo">Annuler le dernier changement</button><button id="reset" class="danger">Tout réinitialiser</button><button id="copy">Copier mes réponses</button></div>
<textarea id="out" hidden readonly aria-label="Texte à copier"></textarea>
<table><thead><tr id="thr"></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const DATA={"key": "discussions-cumul", "title": "Discussions : suite (4)", "intro": "Tous les sujets récents sont sur la même page (onglet « Tout ») ; tes réponses précédentes sont préremplies. Les sujets à traiter sont en premier.", "cols": ["Sujet", "Mes remarques", "Ma question", "Ta réponse"], "btns": ["D'accord", "Pas d'accord", "À discuter"], "tabs": [{"id": "k", "label": "Kit de réparation et barre de vie (à traiter)"}, {"id": "e3", "label": "Énergie lot 3"}, {"id": "e2", "label": "Énergie lot 2 : disjoncteur, lampadaire, transformateur"}, {"id": "e1", "label": "Énergie lot 2 : niveaux de réseau"}, {"id": "p", "label": "Énergie : puissance max des poteaux"}], "rows": [{"id": "k1", "tab": "k", "name": "Utilisation du kit de réparation", "tag": "k1", "recipe": "Corrigé : le kit ne s'utilise plus depuis la fenêtre (F). Il s'utilise uniquement en main : on le prend (sac ou barre de raccourcis), puis clic gauche sur la machine abîmée = 1 charge (+25 %) avec le bruit de clé à cliquet.", "role": "Comment veux-tu tester ? Aujourd'hui seuls les ennemis abîment les machines : veux-tu un moyen de test (mode Créatif : clic droit maintenu + touche pour abîmer une machine) ?", "v": "mod", "c": "Ne peut pas être utilisé en faisant F"}, {"id": "k2", "tab": "k", "name": "Barre de vie des machines", "tag": "k2", "recipe": "Corrigé : plus de barre flottante. Les machines abîmées noircissent (suie par taches) selon l'usure : léger sous 75 % de vie, marqué sous 50 % (avec fumée noire), très marqué sous 25 % (avec étincelles). La vie en pourcentage est affichée dans le panneau de la machine (F).", "role": "Les trois niveaux d'usure te conviennent ? Veux-tu aussi des fissures / pièces cassées quand les modèles 3D seront refaits ?", "v": "mod", "c": "Il n'y a pas de barre qui flotte au dessus de chaque machine, il faudrait un effet sur les modèles pour les rendre abîmés, sinon dans le panneau de la machine on voit sa vie."}, {"id": "k3", "tab": "k", "name": "Emplacement d’amélioration", "tag": "k3", "recipe": "Noté. Pistes : un emplacement où l'on place un objet d'amélioration (consommation, production, vitesse, rendement), ou une montée de niveau payée en ressources (tu aimes moins). Je ne code rien.", "role": "Quand on le fera, quels producteurs et machines en auront un en premier (panneau solaire, éolienne, foreuse, fourneau) ? Un seul emplacement par machine ou plusieurs ?", "v": "yes", "c": "D'accord (amélioration de consommation, production, vitesse, rendement ; un objet à insérer plutôt que payer en ressources, à voir)."}, {"id": "l1", "tab": "e3", "name": "Éolienne, solaire, accumulateur de base, éclairage", "tag": "l1", "recipe": "Faits : éolienne T2 (40 kW, vent variable 15 à 100 %), panneau solaire T3 (60 kW le jour), accumulateur de base T3 (200 MJ, 400 kW), lampadaires qui éclairent la nuit (les 6 plus proches).", "role": "Valides-tu les puissances ?", "v": "mod", "c": "On valide comme ça. Peut-être ajouter un emplacement d'amélioration (panneau solaire qui suit le soleil, éolienne à plus grandes pales), mais on verra plus tard."}, {"id": "l2", "tab": "e3", "name": "Borne de charge → kit de réparation", "tag": "l2", "recipe": "Remplacée par un objet fabriqué à 5 charges qui répare 25 % par charge.", "role": "Équilibrage à voir.", "v": "yes", "c": "Créer un objet qui se craft et qui permet de réparer les objets endommagés, 5 charges, chaque charge répare 25 %, à voir pour l'équilibrage."}, {"id": "d1", "tab": "e2", "name": "Disjoncteur", "tag": "d1", "recipe": "Relie deux poteaux de même niveau ; saute sur surcharge (tous les disjoncteurs fermés du réseau) au lieu du blackout.", "role": "Variante possible : seul le plus proche saute.", "v": "mod", "c": "On peut essayer comme ça."}, {"id": "d2", "tab": "e2", "name": "Lampadaire", "tag": "d2", "recipe": "5 kW, une prise, éclaire la nuit.", "role": "Éclairage + lot 3.", "v": "yes", "c": "On fait l'éclairage et le lot 3."}, {"id": "d3", "tab": "e2", "name": "Transformateur en T2", "tag": "d3", "recipe": "Transformateur avancé en T2, recette au verre au lieu de l'isolant plastique.", "role": "", "v": "yes", "c": ""}, {"id": "n1", "tab": "e1", "name": "Trois niveaux de poteaux + transformateur", "tag": "n1", "recipe": "Bois 500 kW (3 prises, 8 m), haute tension 10 MW (4 prises, 20 m), très haute tension 600 MW (5 prises, 40 m) ; courant descendant par le transformateur.", "role": "", "v": "yes", "c": ""}, {"id": "n2", "tab": "e1", "name": "Le bois plafonne à 500 kW", "tag": "n2", "recipe": "Un réseau bois ne dépasse jamais 500 kW.", "role": "", "v": "yes", "c": ""}, {"id": "p1", "tab": "p", "name": "Ce que tu veux obtenir", "tag": "p1", "recipe": "Hiérarchie gros poteau → moyens → petits.", "role": "", "v": "yes", "c": ""}, {"id": "p2", "tab": "p", "name": "Option A : le poteau le plus faible limite le réseau", "tag": "p2", "recipe": "Capacité limitée par le plus faible poteau.", "role": "", "v": "no", "c": ""}, {"id": "p3", "tab": "p", "name": "Option B : le courant descend par des transformateurs", "tag": "p3", "recipe": "Trois niveaux séparés reliés par transformateurs (retenue).", "role": "", "v": "yes", "c": ""}, {"id": "p4", "tab": "p", "name": "Option C : limite sur la somme des machines raccordées", "tag": "p4", "recipe": "Disjoncteur par poteau.", "role": "", "v": "no", "c": ""}, {"id": "p5", "tab": "p", "name": "Mon avis", "tag": "p5", "recipe": "Option B, avec les puissances 500 kW / 10 MW / 600 MW.", "role": "", "v": "yes", "c": ""}]};
const KEY='terra-reponse-'+DATA.key;
let ans={},hist=[],tab='*',filter='all';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')ans=s}catch(e){}
DATA.rows.forEach(r=>{if(r.v&&!ans[r.id])ans[r.id]={v:r.v,c:r.c||''}});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=DATA.cols||['Proposition','Recette ou principe','Pourquoi','Votre réponse'];
const LAB=DATA.btns?{yes:DATA.btns[0],no:DATA.btns[1],mod:DATA.btns[2]}:{yes:'Oui',no:'Non',mod:'À modifier'};
const $=id=>document.getElementById(id);
$('thr').innerHTML=COLS.map(c=>`<th>${esc(c)}</th>`).join('');
$('flt').innerHTML=`<option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">${LAB.yes}</option><option value="no">${LAB.no}</option><option value="mod">${LAB.mod}</option>`;
$('ttl').textContent=DATA.title;$('intro').textContent=DATA.intro;
function snapshot(){hist.push(JSON.stringify(ans));if(hist.length>60)hist.shift()}
function counts(){const all=DATA.rows.length,done=DATA.rows.filter(r=>ans[r.id]&&ans[r.id].v).length;return{all,done}}
function render(){
 $('tabs').innerHTML=[{id:'*',label:'Tout'},...DATA.tabs].map(t=>{const rs=DATA.rows.filter(r=>t.id==='*'||r.tab===t.id),d=rs.filter(r=>ans[r.id]&&ans[r.id].v).length;return`<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===tab}">${esc(t.label)}<span class="n">${d}/${rs.length}</span></button>`}).join('');
 const rows=DATA.rows.filter(r=>tab==='*'||r.tab===tab).filter(r=>{const a=ans[r.id]||{};return filter==='all'||(filter==='todo'?!a.v:a.v===filter)});
 let lastTab='';
 $('rows').innerHTML=rows.map(r=>{const a=ans[r.id]||{};
  const sec=(tab==='*'&&r.tab!==lastTab)?`<tr class="sec"><td colspan="4">${esc((DATA.tabs.find(t=>t.id===r.tab)||{}).label||r.tab)}</td></tr>`:'';lastTab=r.tab;
  return sec+`<tr data-id="${r.id}" class="${a.v?'done':''}"><td class="name">${esc(r.name)}${(r.tag||r.effort)?`<br><span class="chip ${r.effort==='mécanique'?'meca':''}">${esc(r.tag||(r.effort==='mécanique'?'Mécanique':'Objet'))}</span>`:''}</td><td class="rec" data-l="${esc(COLS[1])}">${esc(r.recipe)}</td><td class="role" data-l="${esc(COLS[2])}">${esc(r.role)}</td>
  <td class="ans"><div class="btns">${['yes','no','mod'].map(v=>`<button class="${v}" data-v="${v}" aria-pressed="${a.v===v}">${LAB[v]}</button>`).join('')}</div><textarea class="note" placeholder="Commentaire (facultatif)" aria-label="Commentaire">${esc(a.c||'')}</textarea></td></tr>`}).join('')||'<tr><td colspan="4">Aucune ligne pour ce filtre.</td></tr>';
 const c=counts();$('cnt').textContent=`${c.done} réponse${c.done>1?'s':''} sur ${c.all}`;$('undo').disabled=!hist.length}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.tab;render()}});
$('flt').onchange=e=>{filter=e.target.value;render()};
$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;const id=b.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.v=a.v===b.dataset.v?'':b.dataset.v;if(!a.v&&!a.c)delete ans[id];save();render()});
$('rows').addEventListener('change',e=>{if(!e.target.classList.contains('note'))return;const id=e.target.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.c=e.target.value.trim();if(!a.v&&!a.c)delete ans[id];save();render()});
$('undo').onclick=()=>{if(!hist.length)return;ans=JSON.parse(hist.pop());save();render()};
let armed=0;$('reset').onclick=()=>{const b=$('reset');if(!armed){armed=1;b.classList.add('arm');b.textContent='Confirmer : tout effacer ?';setTimeout(()=>{armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser'},3500);return}
 snapshot();ans={};save();armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser';render()};
$('copy').onclick=async()=>{
 const lines=[DATA.title];
 DATA.tabs.forEach(t=>{const rs=DATA.rows.filter(r=>r.tab===t.id&&ans[r.id]&&(ans[r.id].v||ans[r.id].c));if(!rs.length)return;lines.push('',t.label);
  rs.forEach(r=>{const a=ans[r.id];lines.push(`- ${r.name} : ${a.v?LAB[a.v].toUpperCase():'(sans choix)'}${a.c?' — '+a.c:''}`)})});
 const todo=DATA.rows.filter(r=>!(ans[r.id]&&ans[r.id].v)).map(r=>r.name);
 if(todo.length)lines.push('',`Sans réponse (${todo.length}) : ${todo.join(', ')}`);
 const txt=lines.join('\n');
 try{await navigator.clipboard.writeText(txt);$('cnt').textContent='Copié : collez-le dans la discussion.'}catch(e){$('out').hidden=false;$('out').value=txt;$('out').select()}};
render();
</script>

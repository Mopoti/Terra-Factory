<title>Page réponse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Page réponse : un tableau de propositions, une colonne pour répondre. Mêmes couleurs que l'arbre des découvertes. */
:root{--bg:#f3f1ec;--panel:#fbfaf7;--fg:#22211e;--mut:#6c6860;--rule:#d9d5cc;--ok:#2f8f5b;--no:#c0392b;--mod:#c2780a;--acc:#3b6fb6;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171815;--panel:#22231f;--fg:#ebe8e0;--mut:#a29d92;--rule:#34352f;--ok:#58c88b;--no:#ff7a68;--mod:#f0a840;--acc:#6fa0ea;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:1.5rem;margin:0;font-weight:600} p{margin:0;color:var(--mut);line-height:1.5;max-width:80ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{font:600 13px var(--sans);padding:8px 14px;border:1px solid var(--rule);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--mut);cursor:pointer}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);border-color:var(--fg)}
.tab .n{font:500 11px var(--mono);margin-left:6px;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:400 12px var(--mono);color:var(--mut)}
button{font:600 12px var(--sans);border-radius:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);cursor:pointer;padding:7px 11px} button:hover{border-color:var(--mut)} button:disabled{opacity:.45;cursor:default}
button.danger.arm{border-color:var(--no);color:var(--no)}
select,textarea{font:400 13px var(--sans);background:var(--bg);color:var(--fg);border:1px solid var(--rule);border-radius:5px;padding:5px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--rule)}
th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
td{padding:10px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:.9rem;line-height:1.45}
td.name{width:22%;font-weight:600} td.rec{width:27%} td.role{width:23%;color:var(--mut)} td.ans{width:28%}
.chip{display:inline-block;font:600 10px var(--mono);padding:1px 6px;border-radius:9px;border:1.5px solid var(--rule);margin-top:4px;color:var(--mut)} .chip.meca{border-color:var(--mod);color:var(--mod)}
.btns{display:flex;gap:5px;flex-wrap:wrap} .btns button{padding:5px 9px}
.btns button[aria-pressed="true"].yes{background:var(--ok);border-color:var(--ok);color:#fff} .btns button[aria-pressed="true"].no{background:var(--no);border-color:var(--no);color:#fff} .btns button[aria-pressed="true"].mod{background:var(--mod);border-color:var(--mod);color:#fff}
.note{width:100%;min-height:34px;margin-top:6px;resize:vertical}
tr.done td.name::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}
#out{width:100%;min-height:140px;font:400 12px var(--mono)}
@media (max-width:760px){table,tbody,tr,td{display:block;width:auto!important} thead{display:none} tr{border:1px solid var(--rule);border-radius:8px;margin-bottom:10px;padding:6px} td{border:none;padding:4px 8px} td.rec::before{content:attr(data-l) " : ";color:var(--mut);font-weight:600} td.role::before{content:attr(data-l) " : ";font-weight:600}}
</style>
<main>
<h1 id="ttl"></h1>
<p id="intro"></p>
<div class="tabs" role="tablist" id="tabs"></div>
<div class="bar"><span id="cnt"></span>
<select id="flt" aria-label="Filtrer"><option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">Oui</option><option value="no">Non</option><option value="mod">À modifier</option></select>
<button id="undo">Annuler le dernier changement</button><button id="reset" class="danger">Tout réinitialiser</button><button id="copy">Copier mes réponses</button></div>
<textarea id="out" hidden readonly aria-label="Texte à copier"></textarea>
<table><thead><tr id="thr"></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
const DATA={"key": "discussions", "title": "Discussions en cours", "intro": "Pour chaque ligne : D'accord (on fait comme ma recommandation), Pas d'accord, ou À discuter, avec un commentaire libre. Une ligne sans recommandation attend ta décision : réponds en commentaire.", "cols": ["Sujet", "Mes remarques", "Ma recommandation", "Ta réponse"], "btns": ["D'accord", "Pas d'accord", "À discuter"], "tabs": [{"id": "s1", "label": "1. Cohérence de l'arbre des découvertes"}, {"id": "s2", "label": "2. Objets ajoutés au tour 259 (écarts provisoires)"}, {"id": "s3", "label": "3. Énergie (chantier non commencé)"}, {"id": "s4", "label": "4. Paquets de science et laboratoire"}, {"id": "s5", "label": "5. Écran des découvertes en jeu"}, {"id": "s6", "label": "6. Projet et documents"}, {"id": "s7", "label": "7. Design à demander à la session Blender"}], "rows": [{"id": "1.1", "tab": "s1", "name": "Lingot d'aluminium après la presse à plastique", "tag": "1.1", "recipe": "Le lingot d'aluminium (T3) a pour prérequis la presse à plastique, parce que c'est la machine de sa recette actuelle. Pas logique : l'aluminium se fond au four électrique.", "role": "garder la recette au four électrique et retirer la presse à plastique des prérequis (le plastique reste nécessaire pour l'isolant)."}, {"id": "1.2", "tab": "s1", "name": "« Laboratoire » partout en T1", "tag": "1.2", "recipe": "Presque toutes les découvertes T1 listent le laboratoire comme prérequis direct, alors que la recette du paquet T1 l'implique déjà.", "role": "le retirer des liens explicites, il reste dans la chaîne."}, {"id": "1.3", "tab": "s1", "name": "Chaîne du pétrole trop longue", "tag": "1.3", "recipe": "Tuyau de laiton → Surpresseur → Remplisseuse de barils → Chevalet de pompage → Raffinerie. Cinq étapes avant le plastique.", "role": "sortir la remplisseuse de la chaîne (elle sert aux barils, pas au pompage)."}, {"id": "1.4", "tab": "s1", "name": "Convertisseur Bessemer très haut", "tag": "1.4", "recipe": "L'acier passe avant presque tout dans l'arbre du coffre quantique (T2 en tête). Voulu ?", "role": "oui, l'acier est la base des châssis renforcés ; rien à changer."}, {"id": "1.5", "tab": "s1", "name": "Armures 3 et 5 sans carapace", "tag": "1.5", "recipe": "Les armures 1, 2 et 4 demandent des carapaces (butin des ennemis) ; les armures 3 et 5 que tu as validées n'en demandent pas (aluminium, tissu, isolant ; fibre de carbone, aluminium, microcontrôleur). Les paquets de combat les paient déjà.", "role": "laisser comme validé."}, {"id": "1.6", "tab": "s1", "name": "Recettes à plus de 3 ou 4 types", "tag": "1.6", "recipe": "Règle validée (3 types, 4 pour les recettes avancées). Laboratoire et accumulateur sont refaits. Il reste une dizaine de recettes à revoir avec les intermédiaires (liste dans la page réponse).", "role": "—"}, {"id": "2.1", "tab": "s2", "name": "Sel de lithium, deutérium, tritium, azote liquide", "tag": "2.1", "recipe": "Ils sortent de la centrifugeuse faute de comportement pour la tour d'évaporation et le compresseur d'air.", "role": "coder la tour (sel de lithium) et le compresseur (azote) avec le réseau électrique, et garder la centrifugeuse pour le deutérium et le tritium."}, {"id": "2.2", "tab": "s2", "name": "Exosquelette", "tag": "2.2", "recipe": "Il se porte à l'emplacement du pantalon et donne +40 kg de sac, rien d'autre. Faut-il aussi un bonus de vitesse de marche ?", "role": "—"}, {"id": "2.3", "tab": "s2", "name": "Propulseur dorsal", "tag": "2.3", "recipe": "Pas ajouté : il prendrait l'emplacement du sac à dos et le vol n'est pas codé. Options : (a) un emplacement dédié, (b) l'intégrer au sac à dos T4, (c) abandonner.", "role": "(a) avec vol plané limité par une batterie."}, {"id": "2.4", "tab": "s2", "name": "Clôture et barrières", "tag": "2.4", "recipe": "Pièces basses (1 m) : passables en sautant ? Ferment-elles une pièce pour le calcul d'intérieur ? Bloquent-elles les ennemis ?", "role": "non passables, ne ferment pas une pièce, bloquent les ennemis."}, {"id": "2.5", "tab": "s2", "name": "Quad électrique, locomotive électrique, wagon plateforme", "tag": "2.5", "recipe": "Rien de codé. La locomotive demande la borne de recharge et la charge progressive que tu as validées.", "role": "les faire après le réseau électrique."}, {"id": "2.6", "tab": "s2", "name": "Formes provisoires", "tag": "2.6", "recipe": "Les 33 nouveaux objets utilisent des formes voisines (tige, verre, puce…) ; les quatre châssis ont la forme du moteur. La liste des modèles à demander à la session Blender est dans `docs/objets-sans-design.md`.", "role": "—"}, {"id": "3.1", "tab": "s3", "name": "Par où commencer", "tag": "3.1", "recipe": "Validé : trois poteaux (bois 3 prises / 8 m, haute tension 4 / 20 m, très haute tension 5 / 40 m), chaque machine consomme une prise, réseaux mixtes, transformateur, compteur au clic, disjoncteur, lampadaire, quad électrique.", "role": "lot 1 = prises sur le poteau bois + compteur au clic ; lot 2 = poteaux HT/THT + transformateur ; lot 3 = éolienne, solaire, accumulateurs."}, {"id": "3.2", "tab": "s3", "name": "Compatibilité des sauvegardes", "tag": "3.2", "recipe": "Les poteaux existants ont un nombre de prises libre aujourd'hui. Passer à 3 prises peut casser des usines posées.", "role": "appliquer la limite seulement aux poteaux posés après la mise à jour."}, {"id": "4.1", "tab": "s4", "name": "Machine de fabrication des paquets", "tag": "4.1", "recipe": "Constructeur ou assembleur ? Quels paquets se font à la main ? Sans réponse j'ai gardé : T1 à la main, les autres à la machine.", "role": "—"}, {"id": "4.2", "tab": "s4", "name": "Recette du paquet T1", "tag": "4.2", "recipe": "« On va en reparler » : recette provisoire 2 fibres + 1 pierre + 1 bois.", "role": "—"}, {"id": "4.3", "tab": "s4", "name": "Visuel des paquets", "tag": "4.3", "recipe": "Les six paquets ont la même forme, seule la couleur change. Un symbole par palier serait plus lisible.", "role": "—"}, {"id": "5.1", "tab": "s5", "name": "Vue d'ensemble", "tag": "5.1", "recipe": "L'arbre entier tient à l'écran mais reste illisible de loin (135 cases).", "role": "zoom automatique sur la découverte choisie et ses prérequis, bouton « tout voir » pour l'ensemble."}, {"id": "5.2", "tab": "s5", "name": "Téléphone", "tag": "5.2", "recipe": "Mise en page à une colonne seulement ébauchée.", "role": "—"}, {"id": "5.3", "tab": "s5", "name": "Liste", "tag": "5.3", "recipe": "Pas de tri ni de filtre par palier ; en rouge je ne montre que les découvertes qui ont déjà un prérequis connu. Trop restrictif ?", "role": "—"}, {"id": "5.4", "tab": "s5", "name": "Étapes déjà faites dans la fenêtre des prérequis", "tag": "5.4", "recipe": "Dans le jeu, la fenêtre « chemin complet » devrait griser les étapes faites (en attendant, simulation par palier dans la page de test).", "role": "l'ajouter à l'écran en jeu au prochain lot."}, {"id": "6.1", "tab": "s6", "name": "GDD", "tag": "6.1", "recipe": "Seul fichier commun aux deux versions. Proposition : décrire les règles seulement (sans technique), une section à la fois, validée avec toi avant la suivante. Par laquelle commencer ?", "role": "—"}, {"id": "6.2", "tab": "s6", "name": "Unreal", "tag": "6.2", "recipe": "Dossier `unreal/` avec le README seulement. Quel est l'objectif de l'essai (rendu, mécanique d'usine, performances) ? Je propose de commencer par une scène avec le personnage et une machine.", "role": "—"}, {"id": "6.3", "tab": "s6", "name": "Rails : grands virages", "tag": "6.3", "recipe": "Les virages grand et géant sont retirés du tracé automatique (essai). À remettre ou à supprimer ?", "role": "—"}, {"id": "6.4", "tab": "s6", "name": "Bug « D ne prend pas la branche marron »", "tag": "6.4", "recipe": "Impossible à reproduire sans fichier. Il me faut le rapport (bouton de rapport, 60 s d'actions).", "role": "—"}, {"id": "7.1", "tab": "s7", "name": "Ordre des modèles", "tag": "7.1", "recipe": "", "role": "(1) modèles portés de l'équipement (aujourd'hui des boîtes), (2) visuels des paquets par palier et des moules, (3) poteaux, transformateur, panneau solaire, éolienne, (4) le reste des 59 objets prévus."}, {"id": "7.2", "tab": "s7", "name": "Veste", "tag": "7.2", "recipe": "Seul objet du jeu sans icône ni modèle.", "role": "—"}]};
const KEY='terra-reponse-'+DATA.key;
let ans={},hist=[],tab=DATA.tabs[0].id,filter='all';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object')ans=s}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=DATA.cols||['Proposition','Recette ou principe','Pourquoi','Votre réponse'];
const LAB=DATA.btns?{yes:DATA.btns[0],no:DATA.btns[1],mod:DATA.btns[2]}:{yes:'Oui',no:'Non',mod:'À modifier'};
const $=id=>document.getElementById(id);
$('thr').innerHTML=COLS.map(c=>`<th>${esc(c)}</th>`).join('');
$('flt').innerHTML=`<option value="all">Toutes les lignes</option><option value="todo">Sans réponse</option><option value="yes">${LAB.yes}</option><option value="no">${LAB.no}</option><option value="mod">${LAB.mod}</option>`;
$('ttl').textContent=DATA.title;$('intro').textContent=DATA.intro;
function snapshot(){hist.push(JSON.stringify(ans));if(hist.length>60)hist.shift()}
function counts(){const all=DATA.rows.length,done=DATA.rows.filter(r=>ans[r.id]&&ans[r.id].v).length;return{all,done}}
function render(){
 $('tabs').innerHTML=DATA.tabs.map(t=>{const rs=DATA.rows.filter(r=>r.tab===t.id),d=rs.filter(r=>ans[r.id]&&ans[r.id].v).length;return`<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id===tab}">${esc(t.label)}<span class="n">${d}/${rs.length}</span></button>`}).join('');
 const rows=DATA.rows.filter(r=>r.tab===tab).filter(r=>{const a=ans[r.id]||{};return filter==='all'||(filter==='todo'?!a.v:a.v===filter)});
 $('rows').innerHTML=rows.map(r=>{const a=ans[r.id]||{};
  return`<tr data-id="${r.id}" class="${a.v?'done':''}"><td class="name">${esc(r.name)}${(r.tag||r.effort)?`<br><span class="chip ${r.effort==='mécanique'?'meca':''}">${esc(r.tag||(r.effort==='mécanique'?'Mécanique':'Objet'))}</span>`:''}</td><td class="rec" data-l="${esc(COLS[1])}">${esc(r.recipe)}</td><td class="role" data-l="${esc(COLS[2])}">${esc(r.role)}</td>
  <td class="ans"><div class="btns">${['yes','no','mod'].map(v=>`<button class="${v}" data-v="${v}" aria-pressed="${a.v===v}">${LAB[v]}</button>`).join('')}</div><textarea class="note" placeholder="Commentaire (facultatif)" aria-label="Commentaire">${esc(a.c||'')}</textarea></td></tr>`}).join('')||'<tr><td colspan="4">Aucune ligne pour ce filtre.</td></tr>';
 const c=counts();$('cnt').textContent=`${c.done} réponse${c.done>1?'s':''} sur ${c.all}`;$('undo').disabled=!hist.length}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b){tab=b.dataset.tab;render()}});
$('flt').onchange=e=>{filter=e.target.value;render()};
$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-v]');if(!b)return;const id=b.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.v=a.v===b.dataset.v?'':b.dataset.v;if(!a.v&&!a.c)delete ans[id];save();render()});
$('rows').addEventListener('change',e=>{if(!e.target.classList.contains('note'))return;const id=e.target.closest('tr').dataset.id;snapshot();const a=ans[id]||(ans[id]={});a.c=e.target.value.trim();if(!a.v&&!a.c)delete ans[id];save();render()});
$('undo').onclick=()=>{if(!hist.length)return;ans=JSON.parse(hist.pop());save();render()};
let armed=0;$('reset').onclick=()=>{const b=$('reset');if(!armed){armed=1;b.classList.add('arm');b.textContent='Confirmer : tout effacer ?';setTimeout(()=>{armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser'},3500);return}
 snapshot();ans={};save();armed=0;b.classList.remove('arm');b.textContent='Tout réinitialiser';render()};
$('copy').onclick=async()=>{
 const lines=[DATA.title];
 DATA.tabs.forEach(t=>{const rs=DATA.rows.filter(r=>r.tab===t.id&&ans[r.id]&&(ans[r.id].v||ans[r.id].c));if(!rs.length)return;lines.push('',t.label);
  rs.forEach(r=>{const a=ans[r.id];lines.push(`- ${r.name} : ${a.v?LAB[a.v].toUpperCase():'(sans choix)'}${a.c?' — '+a.c:''}`)})});
 const todo=DATA.rows.filter(r=>!(ans[r.id]&&ans[r.id].v)).map(r=>r.name);
 if(todo.length)lines.push('',`Sans réponse (${todo.length}) : ${todo.join(', ')}`);
 const txt=lines.join('\n');
 try{await navigator.clipboard.writeText(txt);$('cnt').textContent='Copié : collez-le dans la discussion.'}catch(e){$('out').hidden=false;$('out').value=txt;$('out').select()}};
render();
</script>

<!doctype html><html><body style="margin:0;background:#9cc7e2"><canvas id="c" width="1000" height="560"></canvas>
<script type="module">
import * as THREE from 'three';
import { loadModels } from '/src/render/models.ts';
import { Factory, emptyMachine } from '/src/core/factory/factory.ts';
import { FactoryView } from '/src/render/factoryView.ts';
await loadModels('/');
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(3,8,6); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({color:0x6a9a4a})); ground.rotation.x=-Math.PI/2; scene.add(ground);
const ms=[]; let id=1;
const add=(t,gx,gz,rot=0)=>{const m=emptyMachine(id++,t,gx,gz,rot); ms.push(m); return m;};
add('barrier_concrete',0,0,0); add('barrier_concrete',3,0,0);
add('barrier_reinforced',5,0,1);
add('fence_wood',0,6,0); add('hologram_projector',4,6,0);
add('gate_reinforced',9,0,0);
const f=new Factory(ms,{oreAt:()=>null,mineOre:()=>0});
const view=new FactoryView(scene,f); view.rebuild();
const cam=new THREE.PerspectiveCamera(50,1000/560,0.1,200); cam.position.set(2,5,9); cam.lookAt(3,0.5,1.5);
renderer.render(scene,cam); window.__done=true;
</script></body></html>
